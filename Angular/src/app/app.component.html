<main class="demo-container">
  <dx-data-grid
    [dataSource]="dataSource"
    [showBorders]="true"
    [repaintChangesOnly]="true"
    (onInitialized)="onGridInitialized($event)"
    (onOptionChanged)="onOptionChanged($event)"
    (onSaved)="onSaved()"
  >
    <dxo-data-grid-editing
      mode="batch"
      [allowAdding]="true"
      [allowDeleting]="true"
      [allowUpdating]="true"
    ></dxo-data-grid-editing>
    <dxo-data-grid-toolbar>
      <dxi-data-grid-item name="addRowButton"></dxi-data-grid-item>
      <dxi-data-grid-item name="saveButton"></dxi-data-grid-item>
      <dxi-data-grid-item
        location="after"
        widget="dxButton"
        [options]="undoButtonOptions"
      ></dxi-data-grid-item>
      <dxi-data-grid-item
        name="revertButton"
        [options]="revertButtonOptions"
      ></dxi-data-grid-item>
    </dxo-data-grid-toolbar>
    <dxi-data-grid-column
      dataField="OrderID"
      [width]="110"
      [allowEditing]="false"
    ></dxi-data-grid-column>
    <dxi-data-grid-column dataField="OrderDate" dataType="date" [width]="130">
      <dxi-data-grid-validation-rule
        type="required"
        message="Order Date is required."
      ></dxi-data-grid-validation-rule>
    </dxi-data-grid-column>
    <dxi-data-grid-column
      dataField="ShipName"
      [width]="340"
      [editorOptions]="{ maxLength: 40 }"
    >
      <dxi-data-grid-validation-rule
        type="stringLength"
        [max]="40"
        message="Ship Name must not exceed 40 characters."
      ></dxi-data-grid-validation-rule>
    </dxi-data-grid-column>
    <dxi-data-grid-column
      dataField="ShipCountry"
      [width]="220"
      [editorOptions]="{ maxLength: 15 }"
    >
      <dxi-data-grid-validation-rule
        type="stringLength"
        [max]="15"
        message="Ship Country must not exceed 15 characters."
      ></dxi-data-grid-validation-rule>
    </dxi-data-grid-column>
  </dx-data-grid>

  <section class="options">
    <div class="caption">Options</div>
    <div class="option">
      <label id="max-undo-label" for="max-undo-steps">Maximum undo steps</label>
      <dx-number-box
        id="max-undo-steps"
        [value]="defaultMaxUndoSteps"
        [width]="120"
        [min]="0"
        [max]="1000"
        [step]="1"
        format="#0"
        [showSpinButtons]="true"
        [inputAttr]="{ 'aria-labelledby': 'max-undo-label' }"
        (onValueChanged)="onMaxUndoStepsChanged($event)"
      ></dx-number-box>
    </div>
    <div class="option">
      <label id="undo-types-label" for="undo-types">Undo edit types</label>
      <dx-tag-box
        id="undo-types"
        [width]="250"
        [items]="undoTypes"
        [value]="undoTypes"
        [showSelectionControls]="true"
        [showClearButton]="true"
        [inputAttr]="{ 'aria-labelledby': 'undo-types-label' }"
        (onValueChanged)="onUndoTypesChanged($event)"
      ></dx-tag-box>
    </div>
  </section>
</main>
